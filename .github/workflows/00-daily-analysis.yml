name: 每日股票分析

on:
  schedule:
    # 北京时间周一至周五 17:30；交易日检查会跳过休市日。
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
    inputs:
      check_only:
        description: '只检查配置，不调用 API、不发送邮件'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检查必填配置
        id: config
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          required = ("OPENAI_API_KEY", "TAVILY_API_KEYS", "EMAIL_SENDER", "EMAIL_PASSWORD")
          missing = [key for key in required if not os.environ.get(key, "").strip()]
          ready = not missing
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={str(ready).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## 股票日报配置检查\n\n")
              summary.write("模型：gpt-6.1-sol；北京时间工作日 17:30。\n\n")
              if missing:
                  summary.write("配置尚未填齐，本次安全跳过：不安装依赖、不调用 API、不发送邮件。\n\n")
                  summary.writelines(f"- 缺少 Secret：`{key}`\n" for key in missing)
              else:
                  summary.write("必填项均已填写（未验证凭据有效性）。\n")
              summary.write("\n填写说明：docs/personal-github-setup.md\n")
          print("Configuration complete." if ready else "Missing configuration; analysis safely skipped.")
          PY

      - name: 检出代码
        if: steps.config.outputs.ready == 'true' && inputs.check_only != true
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 设置 Python 环境
        if: steps.config.outputs.ready == 'true' && inputs.check_only != true
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        if: steps.config.outputs.ready == 'true' && inputs.check_only != true
        run: python -m pip install -r requirements.txt

      - name: 分析并发送完整邮件
        if: steps.config.outputs.ready == 'true' && inputs.check_only != true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6.1-sol
          OPENAI_BASE_URL: https://api.openai.com/v1
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_SENDER }}
          # 可选：未来填入自选股；留空时只做 A 股大盘复盘。
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          REPORT_TYPE: full
          REPORT_SUMMARY_ONLY: 'false'
          MERGE_EMAIL_NOTIFICATION: 'true'
          SINGLE_STOCK_NOTIFY: 'false'
          MARKET_REVIEW_ENABLED: 'true'
          MARKET_REVIEW_REGION: cn
          MARKET_REVIEW_COLOR_SCHEME: red_up
          TRADING_DAY_CHECK_ENABLED: 'true'
          AGENT_MODE: 'false'
          BACKTEST_ENABLED: 'false'
          MAX_WORKERS: '1'
          NEWS_MAX_AGE_DAYS: '3'
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Shanghai
        run: |
          # 公开仓库不输出个人报告/邮箱；临时日志随本次任务销毁。
          log="$RUNNER_TEMP/stock-analysis.log"
          trap 'rm -f "$log"' EXIT
          args=(--market-review)
          if [[ -n "${STOCK_LIST//[[:space:]]/}" ]]; then
            args=()
          fi
          status=0
          python main.py "${args[@]}" > "$log" 2>&1 || status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "::error::分析失败（退出码 $status），请检查 API 模型权限、额度及网络。"
            echo "分析失败；未将原始日志或报告公开上传。" >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          if grep -q '邮件发送成功' "$log"; then
            echo "完整报告已提交给邮箱 SMTP 服务器；请检查收件箱及垃圾邮件。" >> "$GITHUB_STEP_SUMMARY"
          elif grep -Eq '非交易日.*跳过|无开市市场|无.*交易日.*跳过' "$log"; then
            echo "非交易日，本次跳过分析和邮件。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::本次未确认邮件发送成功，请检查 SMTP 授权码、邮箱设置和 API 配置。"
            echo "未确认邮件发送成功；未将原始日志或报告公开上传。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi